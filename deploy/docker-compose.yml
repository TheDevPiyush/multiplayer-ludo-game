# Production stack on the droplet, in /opt/simple-ludo (see deploy/README.md).
# GitHub Actions copies this folder there, writes api.env from the API_ENV secret
# and .env with the image tags, then runs release.sh.
#
# No proxy here: the server's existing Caddy owns ports 80/443 and reaches the API
# and website over the shared `edge` network (caddy/simple-ludo.caddy).
name: simple-ludo

services:
  api:
    image: ${IMAGE_PREFIX}/simple-ludo-api:${IMAGE_TAG:-latest}
    env_file: ./api.env
    environment:
      PORT: 8080
      # The shared Caddy is the one proxy in front, so req.ip is the player's address.
      TRUST_PROXY_HOPS: 1
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    networks:
      default:
      edge:
        aliases: [simple-ludo-api]
    restart: unless-stopped
    # Bun as PID 1 gets SIGTERM, flushes live games to Postgres/Redis, then exits.
    init: true
    stop_grace_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  web:
    image: ${IMAGE_PREFIX}/simple-ludo-web:${IMAGE_TAG:-latest}
    networks:
      default:
      edge:
        aliases: [simple-ludo-web]
    restart: unless-stopped
    logging: *logging

  # Live game snapshots, so games survive API restarts and deploys. Not on `edge`.
  redis:
    image: redis:8.2.3-alpine
    command: ['redis-server', '--save', '60', '1', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    logging: *logging

networks:
  # Shared with the server's Caddy; release.sh creates it if missing.
  edge:
    name: edge
    external: true

volumes:
  redis-data:
